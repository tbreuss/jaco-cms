name: CI/CD
on: [push]
jobs:
    test:
        runs-on: ${{ matrix.operating-system }}
        strategy:
            matrix:
                operating-system: [ubuntu-latest]
                php-versions: ['8.2', '8.3', '8.4', '8.5', '8.6']
        name: PHP ${{ matrix.php-versions }} smoke test on ${{ matrix.operating-system }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: json
            - name: Install dependencies
              run: composer install -d jaco
            - name: Run PHP CS Fixer
              run: docker run --rm -v $(pwd)/jaco:/code ghcr.io/php-cs-fixer/php-cs-fixer:${FIXER_VERSION:-3-php${{ matrix.php-versions }}} fix
    publish:
        name: Publish Website
        runs-on: ubuntu-latest
        needs: test
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Checkout git repository
              uses: actions/checkout@v6

            - name: Setup PHP and Composer
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: composer:v2

            - name: Install PHP dependencies
              run: composer install --working-dir jaco --no-dev --prefer-dist --no-progress --no-suggest --optimize-autoloader

            - name: Cleanup directory
              run: |
                  rm -rf .git .github jaco/test
                  rm .editorconfig .gitignore Dockerfile jaco/.php-cs-fixer.php

            - name: Create settings.php file
              run: echo "${{ secrets.SETTINGS_PHP_FILE_CONTENT }}" > jaco/settings.php

            - name: Deploy code to ${{ vars.SSH_TARGET }} on server ${{ vars.SSH_HOST }} with scp
              uses: appleboy/scp-action@master
              with:
                  host: ${{ vars.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: 22
                  source: .
                  target: ${{ vars.SSH_TARGET }}
                  rm: true
                  strip_components: 1
