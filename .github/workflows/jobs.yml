name: CI/CD
on: [push]
jobs:
    test:
        runs-on: ${{ matrix.operating-system }}
        strategy:
            matrix:
                operating-system: [ubuntu-24.04]
                php-versions: ['8.2', '8.3', '8.4', '8.5']
        name: PHP ${{ matrix.php-versions }} tests on ${{ matrix.operating-system }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: json
                  coverage: ${{ matrix.php-versions == '8.4' && 'pcov' || 'none' }}
            - name: Check that a fresh clone has the test directories
              run: bash jaco/test/check-fixtures.sh
            - name: Install dependencies
              run: composer install -d jaco
            - name: Composer audit
              run: composer audit -d jaco
            - name: Composer validate
              run: composer validate --strict -d jaco
            - name: Run PHP CS Fixer
              run: composer cs-check -d jaco
            - name: Run PHPStan
              run: composer phpstan -d jaco
            - name: Run Deptrac
              run: composer deptrac -d jaco
            - name: Run PHPUnit
              run: composer test -d jaco
            - name: Check code coverage
              if: matrix.php-versions == '8.4'
              run: composer coverage -d jaco
            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
            - name: Check JavaScript syntax
              run: find jaco/frontend jaco/test/js \( -name '*.js' -o -name '*.mjs' \) -not -path '*/asset/*' -exec node --check {} \;
            - name: Show browser version
              run: |
                  google-chrome --version || chromium --version || chromium-browser --version || true
            - name: Run QUnit tests
              run: |
                  set -euo pipefail
                  php -S 127.0.0.1:8899 -t . > /tmp/jaco-server.log 2>&1 &
                  server_pid=$!
                  if ! node jaco/test/js/runner.mjs --devtools-timeout=60000 --timeout=60000; then
                      echo '--- PHP server log ---'
                      cat /tmp/jaco-server.log || true
                      kill "$server_pid" 2>/dev/null || true
                      exit 1
                  fi
                  kill "$server_pid" 2>/dev/null || true
            - name: Install Node test dependencies
              if: matrix.php-versions == '8.4'
              run: npm ci --prefix jaco/test/e2e --no-audit --no-fund
            - name: Create E2E settings
              if: matrix.php-versions == '8.4'
              run: php jaco/test/e2e/create-settings.php
            - name: Run E2E smoke tests
              if: matrix.php-versions == '8.4'
              run: npm --prefix jaco/test/e2e run test:e2e
            - name: Upload Playwright report
              if: failure() && matrix.php-versions == '8.4'
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: jaco/test/e2e/playwright-report
                  if-no-files-found: ignore
    publish:
        name: Publish Website
        runs-on: ubuntu-24.04
        needs: test
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Checkout git repository
              uses: actions/checkout@v6

            - name: Setup PHP and Composer
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: composer:v2

            # The checkout is the source tree, not the deployment: stage only what
            # belongs on the server. jaco-data/settings.php, backups/ and runtime/
            # are not in git - they exist on the server and a deploy leaves them
            # alone. Everything else under jaco-data/ comes from the repository.
            - name: Stage application
              run: |
                  # The payload is the content of jaco/, so the archive holds
                  # deploy/app/api.php. strip_components: 2 on upload removes
                  # "deploy/app" and puts api.php directly into <target>/jaco.
                  mkdir -p deploy/app
                  rsync -a --delete \
                      --exclude 'test/' --exclude '.php-cs-fixer.php' \
                      --exclude '.php-cs-fixer.cache' --exclude '.deptrac.cache' \
                      --exclude '.phpunit.cache' --exclude '.phpunit.result.cache' \
                      --exclude 'phpunit.xml' --exclude 'phpstan.neon' --exclude 'deptrac.yaml' \
                      --exclude 'api.http' \
                      --exclude '/vendor/' \
                      --exclude '.DS_Store' \
                      jaco/ deploy/app/
                  # Dependencies for the runtime, without dev packages.
                  composer install --working-dir deploy/app --no-dev --prefer-dist --no-progress --optimize-autoloader
                  # Build inputs and the installer are not runtime files: the
                  # deployment is already installed, and install.php must never
                  # be reachable on the server.
                  rm -f deploy/app/composer.json deploy/app/composer.lock
                  rm -f deploy/app/install.php
                  # Protect the installed dependencies: vendor/ is not served.
                  printf '%s\n' '# Third-party code: never serve directly.' 'Require all denied' > deploy/app/vendor/.htaccess

            - name: Stage website
              run: |
                  mkdir -p deploy/site
                  rsync -a \
                      .htaccess \
                      index.html 404.html features.html docs.html download.html \
                      privacy.html imprint.html elements.html \
                      robots.txt sitemap.xml \
                      assets de \
                      deploy/site/
                  # jaco-data/ is a repository directory: everything git knows about
                  # is staged. Only the credentials are left out - they exist on the
                  # server, not in git, and a deploy must never overwrite them.
                  mkdir -p deploy/site/jaco-data
                  rsync -a --delete \
                      --exclude 'settings.php' \
                      jaco-data/ deploy/site/jaco-data/
                  mkdir -p deploy/site/media
                  rsync -a media/.htaccess deploy/site/media/

            - name: Verify staged application
              run: |
                  test -f deploy/app/api.php
                  test -f deploy/app/vendor/autoload.php
                  # without this file settings.php, cli.php and install.php
                  # would be served: the whitelist lives here
                  test -f deploy/app/.htaccess
                  test ! -f deploy/app/install.php
                  test ! -d deploy/app/test
                  # operator data and runtime state live under jaco-data/, next to
                  # the application - never inside the payload
                  test ! -d deploy/app/jaco-data
                  test ! -d deploy/app/runtime
                  test ! -f deploy/app/settings.php
                  test ! -d deploy/app/_backup
                  test ! -d deploy/app/_template

            - name: Verify staged website
              run: |
                  test -f deploy/site/index.html
                  test -f deploy/site/de/index.html
                  # the root .htaccess carries the Authorization forwarding for
                  # api.php and the cache rules: without it the admin breaks
                  test -f deploy/site/.htaccess
                  # crawler entry points
                  test -f deploy/site/robots.txt
                  test -f deploy/site/sitemap.xml
                  # jaco-data/ comes from the repository, the credentials do not
                  test -f deploy/site/jaco-data/.htaccess
                  test -f deploy/site/jaco-data/templates/site/footer-en.html
                  test -f deploy/site/jaco-data/templates/site/nav-de.html
                  test ! -f deploy/site/jaco-data/settings.php
                  test ! -f deploy/site/settings.php
                  test -f deploy/site/media/.htaccess

            - name: Deploy application to ${{ vars.SSH_TARGET }}/jaco
              uses: appleboy/scp-action@master
              with:
                  host: ${{ vars.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: 22
                  source: deploy/app/
                  target: ${{ vars.SSH_TARGET }}/jaco
                  # Replaces ONLY the jaco/ application directory.
                  # jaco-data/ and media/ live next to it and stay untouched.
                  rm: true
                  # deploy/app/api.php -> <target>/jaco/api.php
                  strip_components: 2

            - name: Deploy website to ${{ vars.SSH_TARGET }}
              uses: appleboy/scp-action@master
              with:
                  host: ${{ vars.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: 22
                  source: deploy/site/
                  target: ${{ vars.SSH_TARGET }}
                  # Overwrites pages and assets, never deletes: operator data
                  # (jaco-data/, media/) is untouched because it is not in the payload.
                  # The installer creates jaco-data/.htaccess, jaco-data/templates/,
                  # media/.htaccess on first run. Deploys must never touch them.
                  rm: false
                  strip_components: 2
