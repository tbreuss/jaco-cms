name: CI/CD
on: [push]
jobs:
    test:
        runs-on: ${{ matrix.operating-system }}
        strategy:
            matrix:
                operating-system: [ubuntu-24.04]
                php-versions: ['8.2', '8.3', '8.4', '8.5']
        name: PHP ${{ matrix.php-versions }} tests on ${{ matrix.operating-system }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: json
                  coverage: ${{ matrix.php-versions == '8.4' && 'pcov' || 'none' }}
            - name: Install dependencies
              run: composer install -d jaco
            - name: Composer audit
              run: composer audit -d jaco
            - name: Composer validate
              run: composer validate --strict -d jaco
            - name: Run PHP CS Fixer
              run: composer cs-check -d jaco
            - name: Run PHPStan
              run: composer phpstan -d jaco
            - name: Run PHPUnit
              run: composer test -d jaco
            - name: Report code coverage
              if: matrix.php-versions == '8.4'
              run: composer test -d jaco -- --coverage-text --only-summary-for-coverage-text
            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
            - name: Check JavaScript syntax
              run: find jaco/frontend jaco/test/js \( -name '*.js' -o -name '*.mjs' \) -not -path '*/asset/*' -exec node --check {} \;
            - name: Run QUnit tests
              run: |
                  php -S 127.0.0.1:8899 -t . > /tmp/jaco-server.log 2>&1 &
                  node jaco/test/js/runner.mjs
    publish:
        name: Publish Website
        runs-on: ubuntu-24.04
        needs: test
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Checkout git repository
              uses: actions/checkout@v6

            - name: Setup PHP and Composer
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: composer:v2

            - name: Install PHP dependencies
              run: composer install --working-dir jaco --no-dev --prefer-dist --no-progress --no-suggest --optimize-autoloader

            - name: Cleanup directory
              run: |
                  rm -rf .git .github jaco/test
                  rm .editorconfig .gitignore Dockerfile jaco/.php-cs-fixer.php

            - name: Create settings.php file
              run: echo "${{ secrets.SETTINGS_PHP_FILE_CONTENT }}" > jaco/settings.php

            - name: Deploy code to ${{ vars.SSH_TARGET }} on server ${{ vars.SSH_HOST }} with scp
              uses: appleboy/scp-action@master
              with:
                  host: ${{ vars.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: 22
                  source: .
                  target: ${{ vars.SSH_TARGET }}
                  rm: true
                  strip_components: 1
