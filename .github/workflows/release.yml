name: Release
on:
    push:
        tags:
            - 'v*'
jobs:
    dist:
        name: Build distribution archive
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Setup PHP and Composer
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: composer:v2
            - name: Build archive
              run: ./build-dist.sh "${GITHUB_REF_NAME}"
            - name: Attach archive to release
              uses: softprops/action-gh-release@v2
              with:
                  files: jaco-dist-*.zip
