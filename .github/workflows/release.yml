name: Release
on:
    push:
        tags:
            - 'v*'
jobs:
    dist:
        name: Build distribution archive
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Setup PHP and Composer
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: composer:v2
            - name: Build archive
              run: ./build-dist.sh "${GITHUB_REF_NAME}"
            - name: Verify archive contents
              run: ./verify-dist-archive.sh "jaco-dist-${GITHUB_REF_NAME}.zip"
            - name: Publish checksum
              # The self-updater installs an archive only when it matches this
              # file, which is attached next to the archive in the release.
              run: |
                  ARCHIVE="jaco-dist-${GITHUB_REF_NAME}.zip"
                  sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
                  cat "$ARCHIVE.sha256"
            - name: Attach archive to release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      jaco-dist-*.zip
                      jaco-dist-*.zip.sha256
