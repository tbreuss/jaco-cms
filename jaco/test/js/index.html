<!DOCTYPE html>
<html lang="en">
<head>
  <!-- the app lives under /jaco/, so relative urls (api.php) resolve like in the app -->
  <base href="/jaco/">
  <meta charset="utf-8">
  <title>Jaco – JS tests</title>
  <link rel="stylesheet" href="/jaco/frontend/vendor/qunit/qunit.css">
  <link rel="stylesheet" href="/jaco/frontend/asset/editor.css">
  <link rel="stylesheet" href="/jaco/frontend/asset/app.css">
  <script src="/jaco/frontend/vendor/qunit/qunit.js"></script>
  <script src="/jaco/frontend/vendor/mithril/mithril.min.js"></script>
  <script src="/jaco/frontend/vendor/quill/quill.min.js"></script>
  <script src="/jaco/frontend/editor.js"></script>
  <script src="/jaco/frontend/contentlists.js"></script>
  <script>
    // the runner reads this through the devtools protocol
    window.__qunitFailures = []
    window.__qunitCounts = {total: 0, passed: 0, failed: 0, skipped: 0}
    // The test that is running right now. A run that never ends leaves no
    // result behind, so this is the only way to say which test hung instead of
    // just that something did. Kept empty until the first test starts, which
    // tells "nothing ran" apart from "test N ran and never finished".
    window.__qunitProgress = ''

    // A test that waits for done() and never gets there (an error inside a
    // timer callback, say) would block the whole run for ever. With a limit it
    // fails after a few seconds and the run goes on. The longest deliberate wait
    // is the 2 s boot load in tests.js; raise a single test with assert.timeout().
    QUnit.config.testTimeout = 5000

    QUnit.on('testStart', (test) => {
      window.__qunitProgress = test.fullName || test.name
    })

    QUnit.on('testEnd', (test) => {
      const counts = window.__qunitCounts
      counts.total++
      if (test.status === 'failed') {
        counts.failed++
        const messages = (test.errors || []).map((error) => error.message || String(error))
        window.__qunitFailures.push((test.fullName || test.name) + ': ' + messages.join(' | '))
      } else if (test.status === 'skipped') {
        counts.skipped++
      } else {
        counts.passed++
      }
    })

    QUnit.on('runEnd', (run) => {
      window.__qunitResult = {
        status: run.status,
        counts: window.__qunitCounts,
        failures: window.__qunitFailures
      }
    })
  </script>
</head>
<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>
  <script type="module" src="/jaco/test/js/tests.js"></script>
</body>
</html>
