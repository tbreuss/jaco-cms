<!DOCTYPE html>
<html lang="en" style="visibility:hidden;">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JACO</title>
    <script>
      // The admin never belongs inside a frame: the site preview loads the start
      // page, and its demo link leads back here - the shell would nest into
      // itself. Links that intend it carry target="_top"; this breaks any other
      // way in as well.
      if (window.top !== window.self) {
        try {
          window.top.location.href = window.location.href
        } catch (e) {
          // a cross-origin parent cannot be navigated
        }
      }
    </script>
    <script>
      // set before CSS paints to avoid a theme flash (see lib/theme.js)
      try {
        var jacoTheme = localStorage.getItem('jaco-theme') || 'auto'
        var jacoDark = jacoTheme === 'dark' || (jacoTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', jacoDark ? 'dark' : 'light')
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="frontend/asset/app.css">
    <script src="frontend/vendor/mithril/mithril.min.js"></script>
    <script src="frontend/vendor/ace-builds/src-min/ace.js"></script>
  </head>
  <body>
    <iframe src="../" frameborder="0" id="iframe"></iframe>
    <div id="app"></div>
    <div id="toasts"></div>
    <script type="module" src="frontend/app.js"></script>
  </body>
</html>
